<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abhishek.e47 | Portfolio</title>
  <style>
    /* 1. DEFINE VARIABLES FOR THE SYSTEM */
    :root {
      /* Default Dark Mode Colors */
      --bg-color: #12110E;
      --text-main: rgb(245, 240, 240);
      --text-sub: #8c8880;
      --accent-dot: rgb(204, 116, 0);
      --nav-sub-text: white;
    }

    /* 2. FLIP VALUES FOR LIGHT MODE */
    body.light-theme {
      --bg-color: #f5f4f0;
      /* Light cream background */
      --text-main: #12110e;
      /* Dark text */
      --text-sub: #6e6b64;
      /* Muted dark grey text */
      --accent-dot: rgb(230, 90, 0);
      /* Vibrant orange for light mode */
      --nav-sub-text: #12110e;
      /* Dark text for e47 brand */
    }

    /* 3. APPLY VARIABLES TO ALL ELEMENTS */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      font-family: monospace;
      color: var(--text-main);
      overflow-x: hidden;
      /* This transitions ALL color properties smoothly when flipping themes */
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .nav-name {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 40px;
    }

    .brand {
      font-size: 30px;
    }

    .brand .name-text {
      color: var(--text-main);
    }

    .brand .dot {
      color: var(--accent-dot);
      font-weight: bolder;
      font-size: 50px;
      line-height: 0;
    }

    .brand .sub-text {
      color: var(--nav-sub-text);
    }

    .nav-menu {
      display: flex;
      gap: 24px;
      align-items: center;
      font-size: 30px;
    }

    .nav-item {
      color: var(--text-sub);
      text-decoration: none;
      display: inline-block;
      padding-bottom: 4px;
      border-bottom: 3px solid transparent;
      transition: color 0.5s ease, border-color 0.5s ease;
      cursor: pointer;
    }

    .nav-item:hover,
    .nav-item.active {
      color: var(--text-main) !important;
      border-bottom-color: var(--text-main) !important;
    }

    .theme-toggle {
      cursor: pointer;
      font-family: inherit;
      border: none;
      background: none;
      font-size: 30px;
      color: var(--text-sub);
      transition: transform 0.3s ease;
    }

    .content-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px;
    }

    .page-section {
      display: none;
    }

    .page-section.active {
      display: block;
    }

    .hero-title {
      font-size: 48px;
      margin-bottom: 20px;
      color: var(--text-main);
    }
  </style>
</head>

<body>

<!-- Combined Layout Container -->

  <!-- Lightweight State Routing Script -->
  <!-- Lightweight State Routing with Tab Memory & Theme Memory Script -->
  <script>
    const navLinks = document.querySelectorAll('.nav-menu .nav-item');
    const sections = document.querySelectorAll('.page-section');

    // ========================================================
    // NEW TAB MEMORY CODE (RUNS IMMEDIATELY ON PAGE LOAD)
    // ========================================================
    // Check the browser notebook to see if the user was on a specific tab before refreshing
    const savedTab = localStorage.getItem('portfolio-tab');

    if (savedTab) {
      // 1. Remove the 'active' highlight look from the default "about" link
      navLinks.forEach(item => item.classList.remove('active'));

      // 2. Find the exact navbar link that matches our saved data-target and highlight it
      const activeLink = document.querySelector(`.nav-menu .nav-item[data-target="${savedTab}"]`);
      if (activeLink) activeLink.classList.add('active');

      // 3. Hide the default active "about" content container section
      sections.forEach(section => section.classList.remove('active'));

      // 4. Find the matching ID content section block and reveal it on screen layout
      const activeSection = document.getElementById(savedTab);
      if (activeSection) activeSection.classList.add('active');
    }
    // ========================================================


    // Tab content switching navigation click listener loop
    navLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();

        // Remove active white underline look from all tabs
        navLinks.forEach(item => item.classList.remove('active'));
        // Add active white underline look to the clicked option tab
        link.classList.add('active');

        // Hide all content containers
        sections.forEach(section => section.classList.remove('active'));

        // Extract the matching target ID value code name
        const targetId = link.getAttribute('data-target');
        // Reveal the corresponding text content panel section layout
        document.getElementById(targetId).classList.add('active');

        // ========================================================
        // NEW LINE: Save the name of the active tab to memory whenever clicked
        // ========================================================
        localStorage.setItem('portfolio-tab', targetId);
      });
    });


    // Grab the theme toggle button element
    const themeBtn = document.querySelector('.theme-toggle');

    // Look into the browser memory notebook for a saved theme preference
    const savedTheme = localStorage.getItem('portfolio-theme');

    // If the memory says 'light', activate it right away!
    if (savedTheme === 'light') {
      document.body.classList.add('light-theme');
      themeBtn.style.transform = 'rotate(180deg)';
    }

    // Listen for a click on the theme button
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-theme');

      if (document.body.classList.contains('light-theme')) {
        themeBtn.style.transform = 'rotate(180deg)';
        localStorage.setItem('portfolio-theme', 'light');
      } else {
        themeBtn.style.transform = 'rotate(0deg)';
        localStorage.setItem('portfolio-theme', 'dark');
      }
    });
  </script>



</body>

</html>
